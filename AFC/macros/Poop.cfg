[gcode_macro AFC_POOP]
gcode:
  {% set gVars                  = printer['gcode_macro _AFC_GLOBAL_VARS'] %}
  {% set travel_speed           = gVars['travel_speed']     | default(120)*60   | float %}
  {% set z_travel_speed         = gVars['z_travel_speed']   | default(30)*60    | float %}
  {% set verbose                = gVars['verbose']          | default(1)        | int %}
  {% set vars                   = printer['gcode_macro _AFC_POOP_VARS'] %}
  {% set purge_x, purge_y       = vars.purge_loc_xy         | default([-1,-1])  | map('float') %}
  {% set purge_spd              = vars['purge_spd']         | default(3.5)*60   | float %}
  {% set z_poop                 = vars['z_purge_move']      | default(true)     | lower == 'true' %}
  {% set fast_z                 = vars['fast_z']            | default(200)*60   | float %}
  {% set z_lift                 = vars['z_lift']            | default(15)       | float %}
  {% set part_cooling_fan       = vars['part_cooling_fan']  | default(true)     | lower == 'true' %}
  {% set part_cooling_fan_speed = vars['part_cooling_fan_speed']| default(1.0)  | float %}
  {% set purge_cool_time        = vars['purge_cool_time']   | default(4)*1000   | float %}
  {% set purge_length           = vars['purge_length']      | default(72.111)   | float %}
  {% set purge_length_minimum   = vars['purge_length_minimum']| default(60.999) | float %}
  {% set purge_start            = vars['purge_start']       | default(0.15)     | float %}
  {% set restore_position       = vars['restore_position']  | default(false)    | lower == 'true' %}
  
  # Blobifier adaptive variables
  {% set max_iteration_length   = vars['max_iteration_length'] | default(60)    | float %}
  {% set iteration_z_raise      = vars['iteration_z_raise'] | default(3.2)      | float %}
  {% set iteration_z_change     = vars['iteration_z_change']| default(0.9)      | float %}
  {% set max_iterations_per_blob= vars['max_iterations_per_blob'] | default(2) | int %}
  {% set purge_z                = vars['purge_z']           | default(0)        | float %}
  
  M400
  {% if verbose > 0 %}
    RESPOND TYPE=command MSG='AFC_Poop: Starting adaptive blob purging'
  {% endif %}

  SAVE_GCODE_STATE NAME=_AFC_POOPING

  # Enable part cooling fan to freeze the blob base
  {% if part_cooling_fan %}
    {% set backup_fan_speed = printer.fan.speed %}
    M106 S{(part_cooling_fan_speed * 255)|int}
  {% endif %}
  
  # Reset feedrate to 100% for consistent extrusion
  {% set backup_feedrate = printer.gcode_move.speed_factor %}
  M220 S100
    
  # Determine purge length
  {% if params.PURGE_LENGTH %}
    {% set purge_len = params.PURGE_LENGTH|float %}
  {% else %} 
    {% set purge_len = purge_length %}
  {% endif %}
    
  # Apply minimum purge length safety margin
  {% set purge_len = [purge_len, purge_length_minimum]|max %}
  G90

  AFC_DISABLE_SKEW
  
  # Move to purge location
  G1 X{purge_x} Y{purge_y} F{travel_speed}

  # Drop nozzle close to the bed to squash the first layer into a "pancake" anchor
  {% if z_poop %}
    G1 Z{purge_z + purge_start} F{z_travel_speed}
  {% endif %}
    
  {% set iterations = (purge_len / max_iteration_length)|round(0, 'ceil')|int %}

  # Main adaptive squashing loop
  {% for n in range(iterations) %}
    {% set step = n % max_iterations_per_blob %}
    
    # If starting a new blob, reset Z height back down
    {% if step == 0 and n > 0 %}
      G90
      {% if z_poop %}
        # Small hop to prevent crashing into the previous blob if still present
        G1 Z{purge_z + purge_start + 5} F{fast_z}
        G1 Z{purge_z + purge_start} F{z_travel_speed}
      {% endif %}
    {% endif %}

    {% set purge_amount_left = purge_len - (max_iteration_length * n) %}
    {% set extrude_amount =